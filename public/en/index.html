<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish TTS</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--text:#14171a;--muted:#6b7480;--accent:#2563eb;--border:#e3e6ea}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#171a1f;--text:#eceef1;--muted:#8b94a0;--accent:#5b8def;--border:#262b33}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;padding:24px}
  main{max-width:720px;margin:0 auto}
  h1{font-size:1.6rem;margin:0 0 4px}
  p.sub{color:var(--muted);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
  textarea,input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
  textarea{min-height:160px;resize:vertical}
  .row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--border);font-weight:500}
  button:disabled{opacity:.5;cursor:not-allowed}
  .voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
  .voice{border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:.9rem}
  .voice.sel{border-color:var(--accent);outline:2px solid var(--accent)}
  .voice small{display:block;color:var(--muted)}
  audio{width:100%;margin-top:12px}
  #msg{color:#d33;font-size:.9rem;margin-top:10px;white-space:pre-wrap}
  .count{float:right;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Fish TTS</h1>
  <p class="sub">Change text to voice with Fish Audio.</p>

  <div class="card">
    <label>Teks <span class="count" id="count">0</span></label>
    <textarea id="text" placeholder="Write or paste text here..."></textarea>
  </div>

  <div class="card">
    <label>Search sound (optional, blank = default sound)</label>
    <div class="row">
      <div style="flex:2"><input id="q" placeholder="e.g. narrator, anime, indonesia"></div>
      <div><button class="ghost" id="search" style="width:100%">Cari</button></div>
    </div>
    <div class="voices" id="voices"></div>
  </div>

  <div class="card">
    <div class="row">
      <div><label>Format</label><select id="format"><option value="mp3">MP3</option><option value="wav">WAV</option></select></div>
      <div><label>Speed: <span id="sv">1.0</span>x</label><input type="range" id="speed" min="0.5" max="2" step="0.1" value="1"></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button id="go">Make a sound</button>
      <a id="dl" download="tts.mp3" style="display:none"><button class="ghost" type="button">Download</button></a>
    </div>
    <audio id="player" controls style="display:none"></audio>
    <div id="msg"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let voiceId = "";

$("text").oninput = () => $("count").textContent = $("text").value.length;
$("speed").oninput = () => $("sv").textContent = Number($("speed").value).toFixed(1);

async function loadVoices() {
  $("voices").innerHTML = "<small>Memuat...</small>";
  try {
    const r = await fetch("/api/voices?q=" + encodeURIComponent($("q").value));
    const list = await r.json();
    if (!r.ok) throw new Error(list.error || "Gagal");
    $("voices").innerHTML = "";
    list.forEach((v) => {
      const d = document.createElement("div");
      d.className = "voice" + (v.id === voiceId ? " sel" : "");
      d.innerHTML = "<b></b><small></small>";
      d.querySelector("b").textContent = v.title;
      d.querySelector("small").textContent = (v.languages || []).join(", ");
      d.onclick = () => {
        voiceId = v.id === voiceId ? "" : v.id;
        document.querySelectorAll(".voice").forEach((x) => x.classList.remove("sel"));
        if (voiceId) d.classList.add("sel");
      };
      $("voices").appendChild(d);
    });
  } catch (e) { $("voices").innerHTML = ""; $("msg").textContent = e.message; }
}
$("search").onclick = loadVoices;
$("q").onkeydown = (e) => e.key === "Enter" && loadVoices();

$("go").onclick = async () => {
  $("msg").textContent = "";
  const text = $("text").value.trim();
  if (!text) { $("msg").textContent = "Isi teks dulu."; return; }
  $("go").disabled = true; $("go").textContent = "Memproses...";
  try {
    const format = $("format").value;
    const r = await fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, voiceId, format, speed: $("speed").value }),
    });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || "Gagal membuat suara"); }
    const url = URL.createObjectURL(await r.blob());
    $("player").src = url; $("player").style.display = "block"; $("player").play();
    $("dl").href = url; $("dl").download = "tts." + format; $("dl").style.display = "inline";
  } catch (e) { $("msg").textContent = e.message; }
  $("go").disabled = false; $("go").textContent = "Buat suara";
};

loadVoices();
</script>
</body>
</html>
